<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz de Fórmulas Excel</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: ecrã de projeção estilo votação ao vivo; pergunta + grelha de folha de cálculo à esquerda, opções/resultados à direita; telemóvel numa coluna */
:root{
  --bg:#FBF8F9; --surface:#FFFFFF; --ink:#2A1F23; --muted:#6E5F65; --line:#E6DADF;
  --vinho:#722F3F; --rosa:#F6EFF1; --grid:#EEF3EE; --gridline:#CFDACF; --alvo:#FFF1B8;
  --a:#722F3F; --b:#1F7A6D; --c:#B7791F; --d:#3E5C9A;
  --certo:#1E7B45; --errado:#B3261E;
  --f-disp:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1518; --surface:#271E22; --ink:#F3ECEE; --muted:#B9A9AF; --line:#3E3237;
  --vinho:#E7A3B2; --rosa:#33252A; --grid:#1F2A22; --gridline:#34443A; --alvo:#5A4A12;
  --a:#D98A9C; --b:#4FC1AE; --c:#E3AE55; --d:#8EA8E6; --certo:#5BD08A; --errado:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1518; --surface:#271E22; --ink:#F3ECEE; --muted:#B9A9AF; --line:#3E3237;
  --vinho:#E7A3B2; --rosa:#33252A; --grid:#1F2A22; --gridline:#34443A; --alvo:#5A4A12;
  --a:#D98A9C; --b:#4FC1AE; --c:#E3AE55; --d:#8EA8E6; --certo:#5BD08A; --errado:#FF8A80; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--vinho);outline-offset:2px}
a{color:var(--vinho)}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--vinho);padding-bottom:10px}
.marca{display:flex;flex-direction:column}
.marca small{font-weight:700;letter-spacing:.28em;font-size:11px;color:var(--vinho);text-transform:uppercase}
.marca b{font-family:var(--f-disp);font-weight:800;font-size:22px;line-height:1.1}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{text-decoration:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:15px;color:var(--ink);background:var(--surface)}
.nav a[aria-current="page"]{background:var(--vinho);color:var(--bg);border-color:var(--vinho)}
h1,h2{font-family:var(--f-disp);font-weight:800;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,52px)}
.lead{color:var(--muted);max-width:60ch;margin:0}
/* início */
.modos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.modo{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;text-decoration:none;color:var(--ink)}
.modo:hover{border-color:var(--vinho)}
.modo .tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--vinho)}
.modo h2{font-size:26px}
.modo p{margin:0;color:var(--muted);font-size:16px}
.factos{display:flex;gap:24px;flex-wrap:wrap;color:var(--muted);font-size:15px}
.factos b{font-family:var(--f-disp);font-size:28px;color:var(--ink);display:block;font-variant-numeric:tabular-nums}
/* slide */
.barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--rosa);color:var(--vinho);font-weight:700;font-size:14px}
.nivel1{background:color-mix(in srgb,var(--b) 16%,transparent);color:var(--b)}
.nivel2{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.nivel3{background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--a)}
.slide{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.slide{grid-template-columns:minmax(0,1fr)}}
.perg{display:flex;flex-direction:column;gap:16px;min-width:0}
.perg h2{font-size:clamp(24px,3.2vw,36px);font-weight:600}
.perg h2 strong{font-weight:800;color:var(--vinho)}
code,.f{font-family:var(--f-mono);font-weight:700;font-size:.86em;background:var(--rosa);color:var(--vinho);padding:.08em .35em;border-radius:5px;word-break:break-word}
.fn{color:var(--vinho)} .str{color:var(--b)} .ref{color:var(--d)}
/* folha */
.folha{overflow-x:auto;border:1px solid var(--gridline);border-radius:8px;background:var(--surface);max-width:100%}
.folha table{border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums;min-width:100%}
.folha th,.folha td{border:1px solid var(--gridline);padding:4px 10px;white-space:nowrap;text-align:left}
.folha thead th,.folha .rn{background:var(--grid);color:var(--muted);font-weight:400;font-size:12px;text-align:center;font-family:var(--f-mono)}
.folha .rn{width:34px}
.folha tr.cab td{font-weight:700}
.folha td.num{text-align:right}
.folha td.alvo{background:var(--alvo);outline:2px solid var(--c);outline-offset:-2px;font-weight:700;text-align:center}
.legenda{font-size:13px;color:var(--muted);margin-top:-8px}
/* opções */
.ops{display:flex;flex-direction:column;gap:10px;min-width:0}
.op{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;
  padding:12px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);overflow:hidden;text-align:left;width:100%}
.op .letra{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:20px;color:var(--bg);background:var(--k)}
.op .txt{font-family:var(--f-mono);font-weight:500;font-size:16px;word-break:break-word;position:relative;z-index:1}
.op .txt.plano{font-family:var(--f-body);font-size:18px}
.op .pct{font-family:var(--f-disp);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;position:relative;z-index:1;min-width:3ch;text-align:right}
.op .enche{position:absolute;inset:0 auto 0 0;width:0;background:color-mix(in srgb,var(--k) 18%,transparent);transition:width .6s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.op .enche{transition:none}}
.op.certa{border-color:var(--certo);box-shadow:0 0 0 2px var(--certo) inset}
.op.errada-escolha{border-color:var(--errado)}
.op.apagada{opacity:.55}
button.op:hover:not([disabled]){border-color:var(--k)}
button.op[aria-pressed="true"]{border-color:var(--k);box-shadow:0 0 0 2px var(--k) inset}
button.op[disabled]{cursor:default}
.explica{border-left:5px solid var(--certo);background:var(--surface);border-radius:0 12px 12px 0;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.explica b{color:var(--certo)}
.explica.mal{border-left-color:var(--errado)} .explica.mal b{color:var(--errado)}
.controlos{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}
.grupo{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px}
.btn.prim{background:var(--vinho);border-color:var(--vinho);color:var(--bg)}
.btn[disabled]{opacity:.45;cursor:default}
select{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.conta{font-family:var(--f-disp);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.aviso{background:var(--rosa);border-radius:12px;padding:12px 16px;font-size:16px}
.progresso{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.progresso i{display:block;height:100%;background:var(--vinho);transition:width .3s}
.vazio{text-align:center;padding:48px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.vazio .relogio{font-family:var(--f-mono);font-size:40px;color:var(--vinho)}
.final{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.final .grande{font-family:var(--f-disp);font-weight:800;font-size:72px;line-height:1;color:var(--vinho);font-variant-numeric:tabular-nums}
.lista-temas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;width:100%}
.lista-temas div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px}
.sala{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--surface);border:2px solid var(--vinho);border-radius:16px;padding:16px}
.sala img{border-radius:8px;background:#fff;padding:6px;max-width:100%;height:auto}
.sala-txt{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1}
.codigo small{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.codigo b{font-family:var(--f-mono);font-size:clamp(44px,7vw,72px);letter-spacing:.12em;color:var(--vinho);line-height:1}
.sala .link{font-size:14px;word-break:break-all}
</style>
</head>
<body>


<div class="wrap">
  <header class="topo">
    <div class="marca"><small>Aplicações Informáticas para a Gestão</small><b>Quiz de Fórmulas</b></div>
    <nav class="nav" aria-label="Modos">
      <a href="#inicio" data-v="inicio">Início</a>
      <a href="#apresentar" data-v="apresentar">Apresentar</a>
      <a href="#responder" data-v="responder">Responder</a>
      <a href="#estudar" data-v="estudar">Estudar sozinho</a>
    </nav>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<script>
// n: nível (1 Fácil, 2 Médio, 3 Difícil) · t: tipo · g: tabela de contexto (linha 1 = cabeçalho) · a: célula a preencher [linha, coluna]
const Q = [
{id:"soma",n:1,tema:"Contas",t:"Que fórmula?",
 g:{rows:[["Aluno","Teste 1","Teste 2","Teste 3","Teste 4","Total"],["João",12,14,9,15,"?"]]},a:[1,5],
 p:"Queres o **total** das 4 notas do João na célula F2. Que fórmula usas?",
 o:["=SOMA(B2:E2)","=MÉDIA(B2:E2)","=CONTAR(B2:E2)","=MÁXIMO(B2:E2)"],c:0,
 e:"Para somar usa-se SOMA com o intervalo das notas: de B2 até E2."},
{id:"media-int",n:1,tema:"Contas",t:"Que parâmetros?",
 g:{rows:[["Aluno","Teste 1","Teste 2","Teste 3","Teste 4","Média"],["Rita",11,13,16,10,"?"]]},a:[1,5],
 p:"Completa a fórmula da média da Rita: `=MÉDIA( ___ )`",
 o:["B2:E2","B2;E2","B2-E2","\"B2:E2\""],c:0,
 e:"Os dois pontos querem dizer \"de B2 até E2\". Com ; só contava B2 e E2. Com aspas o Excel lê como texto."},
{id:"maximo",n:1,tema:"Contas",t:"Que fórmula?",
 g:{rows:[["Aluno","Média"],["Ana",14.5],["Rui",9.25],["Sara",17],["Tiago",12],["Maior média","?"]]},a:[5,1],
 p:"Queres saber a **maior média** da turma. Que fórmula usas em B6?",
 o:["=MAIOR(B2:B5)","=MÁXIMO(B2:B5)","=SOMA(B2:B5)","=ORDEM.EQ(B2:B5)"],c:1,
 e:"MÁXIMO dá o número maior. MAIOR também serve, mas precisa da posição: =MAIOR(B2:B5; 1)."},
{id:"contar-vazio",n:1,tema:"Contar",t:"Que fórmula?",
 g:{rows:[["Nome","Cargo","Salário"],["Ana","Gerente","1 800 €"],["Rui","Vendedor",""],["Sara","Analista","1 450 €"],["Tiago","Segurança",""]]},
 p:"Queres saber **quantos salários ainda estão por preencher**. Que fórmula usas?",
 o:["=CONTAR(C2:C5)","=CONTAR.VAL(C2:C5)","=CONTAR.VAZIO(C2:C5)","=CONTAR.SE(C2:C5)"],c:2,
 e:"Células vazias contam-se com CONTAR.VAZIO. Neste caso dá 2."},
{id:"contar-num",n:1,tema:"Contar",t:"Que fórmula?",
 g:{rows:[["Valores"],[25],["olá"],[40],["#N/D"],[13]]},
 p:"A lista tem números, texto e erros. Queres contar **só os números**.",
 o:["=CONTAR.VAL(A2:A6)","=CONTAR(A2:A6)","=SOMA(A2:A6)","=CONTAR.VAZIO(A2:A6)"],c:1,
 e:"CONTAR só conta números. CONTAR.VAL contava tudo o que está escrito (dava 5)."},
{id:"se-simples",n:1,tema:"SE",t:"Qual está certa?",
 g:{rows:[["Aluno","Média","Situação"],["Rui",12,"?"]]},a:[1,2],
 p:"O aluno passa com **10 ou mais**. Qual é a fórmula certa para C2?",
 o:["=SE(B2>10; \"Aprovado\"; \"Reprovado\")","=SE(B2>=10; Aprovado; Reprovado)","=SE(B2>=10; \"Aprovado\"; \"Reprovado\")","=SE(\"B2>=10\"; \"Aprovado\"; \"Reprovado\")"],c:2,
 e:"10 ou mais escreve-se >=. As palavras levam aspas. A pergunta (B2>=10) não leva aspas."},
{id:"virgula",n:1,tema:"Regras",t:"Encontra o erro",
 p:"No Excel em português, esta fórmula dá erro: `=SE(B2>=10, \"Aprovado\", \"Reprovado\")`. Porquê?",
 o:["Faltam aspas","Usa vírgulas em vez de ponto e vírgula","O SE não aceita texto","Falta o sinal ="],c:1,
 e:"No Excel português as partes separam-se com ; (ponto e vírgula)."},
{id:"dolar",n:2,tema:"Regras",t:"Encontra o erro",
 g:{rows:[["Código","Produto","Preço"],[1,"Caneta","0,80 €"],[2,"Caderno","2,50 €"],[3,"Lápis","0,40 €"]]},
 p:"Escreveste `=PROCV(E2; A2:C4; 2; FALSO)` e arrastaste para baixo. Nas linhas seguintes dá erro. Como corriges?",
 o:["Trocar FALSO por VERDADEIRO","Pôr $ na tabela: $A$2:$C$4","Trocar 2 por 3","Pôr aspas em E2"],c:1,
 e:"Sem $ a tabela anda quando arrastas (passa a A3:C5…). O $ prende a tabela no sítio."},
{id:"maior2",n:1,tema:"Contas",t:"Que parâmetros?",
 p:"Queres o **2.º maior** valor das vendas em D2:D18. Completa: `=MAIOR(D2:D18; ___ )`",
 o:["2","-2","\"2.º\"","D2"],c:0,
 e:"MAIOR pede o intervalo e a posição. Posição 2 = segundo maior."},
{id:"ordem",n:2,tema:"Contas",t:"Que fórmula?",
 g:{rows:[["Nadador","Tempo (s)","Lugar"],["Ana",58.2,"?"],["Rui",55.9,""],["Sara",61.4,""]]},a:[1,2],
 p:"Queres saber em que **lugar** ficou a Ana. O menor tempo ganha. Que fórmula usas?",
 o:["=ORDEM.EQ(B2; B$2:B$4; 1)","=ORDEM.EQ(B2; B$2:B$4; 0)","=MÍNIMO(B2:B4)","=MENOR(B2:B4; 1)"],c:0,
 e:"ORDEM.EQ dá o lugar. O último parâmetro 1 ordena do menor para o maior, porque aqui o menor tempo é o 1.º."},
{id:"idade-ano",n:2,tema:"Datas",t:"Que fórmula?",
 g:{rows:[["Matrícula","Ano","Idade"],["AA-11-BB",2016,"?"]]},a:[1,2],
 p:"Queres a **idade do carro** em C2, a partir do ano em B2.",
 o:["=HOJE()-B2","=ANO(HOJE())-B2","=ANO(B2)-HOJE()","=DATADIF(B2; HOJE())"],c:1,
 e:"ANO(HOJE()) dá o ano em que estamos. Tira-se o ano do carro."},
{id:"esquerda",n:2,tema:"Texto",t:"Que fórmula?",
 g:{rows:[["Código","Tipo"],["CAR-2019-05","?"]]},a:[1,1],
 p:"O código é **CAR-2019-05**. Queres só o tipo: as **3 primeiras letras**.",
 o:["=DIREITA(A2; 3)","=ESQUERDA(A2; 3)","=SEG.TEXTO(A2; 3)","=NÚM.CARAT(A2)"],c:1,
 e:"ESQUERDA tira letras do início. Aqui 3 letras: CAR."},
{id:"segtexto",n:2,tema:"Texto",t:"Que parâmetros?",
 g:{rows:[["Código","Ano"],["CAR-2019-05","?"]]},a:[1,1],
 p:"O ano **2019** começa na posição 5 e tem 4 caracteres. Completa: `=SEG.TEXTO(A2; ___ ; ___ )`",
 o:["4; 5","5; 4","5; 8","2019; 4"],c:1,
 e:"SEG.TEXTO(texto; onde começa; quantas letras). Começa na 5.ª e tira 4."},
{id:"juntar",n:2,tema:"Texto",t:"Que fórmula?",
 g:{rows:[["Nome","Apelido","Apelido, Nome"],["Ana","Silva","?"]]},a:[1,2],
 p:"Queres escrever **Silva, Ana** em C2.",
 o:["=A2&B2","=B2&\", \"&A2","=B2+\", \"+A2","=SOMA(B2; A2)"],c:1,
 e:"O & junta textos. A vírgula e o espaço vão entre aspas: \", \"."},
{id:"procv-col",n:2,tema:"Procurar",t:"Que parâmetros?",
 g:{rows:[["Código","Descrição","Preço"],[101,"Teclado","25 €"],[102,"Rato","12 €"],[103,"Monitor","140 €"]]},
 p:"Queres o **preço** do código em F2. Completa: `=PROCV(F2; $A$2:$C$4; ___ ; FALSO)`",
 o:["1","2","3","C"],c:2,
 e:"O preço está na 3.ª coluna da tabela (A=1, B=2, C=3). Escreve-se o número, não a letra."},
{id:"procv-falso",n:2,tema:"Procurar",t:"Que parâmetros?",
 p:"Procuras um **código exato** (ex. 102) numa tabela de produtos. O último parâmetro do PROCV deve ser…",
 o:["VERDADEIRO","FALSO","0,5","Fica vazio"],c:1,
 e:"FALSO = procura exata. É o certo para códigos."},
{id:"procv-escalao",n:2,tema:"Procurar",t:"Que fórmula?",
 g:{rows:[["Nota mínima","Conceito"],[0,"Insuficiente"],[10,"Suficiente"],[14,"Bom"],[17,"Muito bom"]]},
 p:"A média do aluno está em F3. Queres o **conceito** usando esta tabela (I2:J5).",
 o:["=PROCV(F3; $I$2:$J$5; 2; VERDADEIRO)","=PROCV(F3; $I$2:$J$5; 2; FALSO)","=PROCH(F3; $I$2:$J$5; 2; VERDADEIRO)","=SE(F3; $I$2:$J$5)"],c:0,
 e:"Uma nota de 15,3 não aparece na tabela. VERDADEIRO procura o escalão onde ela cai (Bom). A 1.ª coluna tem de estar do menor para o maior."},
{id:"proch",n:2,tema:"Procurar",t:"Que fórmula?",
 g:{rows:[["Eixos","E10","E20","E30"],["Rolamentos",4,6,8]]},
 p:"A tabela está **deitada**: os códigos estão numa linha. Queres os rolamentos do eixo escolhido em C8.",
 o:["=PROCV(C8; B1:D2; 2; FALSO)","=PROCH(C8; B1:D2; 2; FALSO)","=ÍNDICE(C8; B1:D2)","=PROCH(C8; B1:D2; 2)"],c:1,
 e:"Tabela em linha → PROCH. O 2 é a linha onde está a resposta. FALSO para valor exato."},
{id:"seerro",n:2,tema:"Procurar",t:"Que fórmula?",

function realca(f){
  const parts = []; let rx = /("([^"]|"")*")|([A-ZÁÉÍÓÚÂÊÔÃÕÇ][A-ZÁÉÍÓÚÂÊÔÃÕÇ0-9.]*)(?=\()|(\$?[A-Z]{1,2}\$?\d+(:\$?[A-Z]{1,2}\$?\d+)?)/g, last=0, m;
  while((m = rx.exec(f))){ parts.push(esc(f.slice(last,m.index)));
    if(m[1]) parts.push(`<span class="str">${esc(m[1])}</span>`);
    else if(m[3]) parts.push(`<span class="fn">${esc(m[3])}</span>`);
    else parts.push(`<span class="ref">${esc(m[4])}</span>`);
    last = rx.lastIndex; }
  parts.push(esc(f.slice(last))); return parts.join("");
}
function texto(t){ // **negrito** e `código`
  return esc(t).replace(/`([^`]+)`/g,(_,c)=>`<code>${realca(c.replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&'))}</code>`)

}
const eFormula = s => /^=/.test(s) || /[;:$]/.test(s) || /^[-+*&]/.test(s) || /^"/.test(s) || /^[A-Z]\d/.test(s);
function folha(q){
  if(!q.g) return "";
  const rows = q.g.rows, ncol = Math.max(...rows.map(r=>r.length));
  let h = `<div class="folha"><table><thead><tr><th class="rn"></th>`;
  for(let c=0;c<ncol;c++) h += `<th>${String.fromCharCode(65+c)}</th>`;
  h += `</tr></thead><tbody>`;
  rows.forEach((r,i)=>{ h += `<tr class="${i===0?'cab':''}"><td class="rn">${i+1}</td>`;
    for(let c=0;c<ncol;c++){ const v = r[c]===undefined?"":r[c]; const alvo = q.a && q.a[0]===i && q.a[1]===c;
      h += `<td class="${alvo?'alvo':''} ${typeof v==='number'?'num':''}">${esc(typeof v==='number'? String(v).replace('.',','):v)}</td>`; }
    h += `</tr>`; });
  h += `</tbody></table></div>`;
  if(q.a) h += `<div class="legenda">A célula amarela (${String.fromCharCode(65+q.a[1])}${q.a[0]+1}) é onde vai a fórmula.</div>`;
  return h;
}

}
function opcoes(q, {modo, escolha=null, contagens=null, revelar=false}){
  const total = contagens ? contagens.reduce((a,b)=>a+b,0) : 0;
  return `<div class="ops" role="${modo==='votar'?'group':'list'}" aria-label="Opções">` + q.o.map((o,i)=>{
    const k = CORES[i]; const pct = contagens ? (total? Math.round(contagens[i]/total*100):0) : null;
    let cls = "op"; if(revelar){ if(i===q.c) cls+=" certa"; else if(i===escolha) cls+=" errada-escolha"; else cls+=" apagada"; }
    const txt = `<span class="txt ${eFormula(o)?'':'plano'}">${eFormula(o)?realca(o):esc(o)}</span>`;
    const fim = pct!==null ? `<span class="pct">${pct}%</span>` : (revelar && i===q.c ? `<span class="pct" style="color:var(--certo)">✓</span>` : `<span></span>`);
    const enche = pct!==null ? `<span class="enche" style="width:${pct}%"></span>` : "";

    if(modo==='votar') return `<button class="${cls}" style="--k:var(${k})" data-op="${i}" aria-pressed="${escolha===i}" ${revelar?'disabled':''}>${inner}</button>`;

  }).join("") + `</div>`;
}

  cliente.on("error", ()=>{ estadoLigacao = "erro"; render(); });
  cliente.on("message", (t, buf)=>{

    }
  });

      style="font:700 40px var(--f-mono);letter-spacing:.3em;text-align:center;width:6.5em;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)">
    <button class="btn prim" type="submit">Entrar</button></form>`;
  if(estadoLigacao === "erro") return `<div class="vazio"><h2>Não foi possível ligar</h2><p class="lead">Verifica a internet e recarrega a página. A rede da escola pode estar a bloquear a ligação.</p></div>`;
  if(!aoVivo || estadoLigacao !== "ligado" && !recebeuEstado) return `<div class="vazio"><div class="relogio">· · ·</div><h2>A entrar na sala ${esc(sala)}…</h2></div>`;
  if(!recebeuEstado) return `<div class="vazio"><div class="relogio">Sala ${esc(sala)}</div><h2>Já estás dentro</h2><p class="lead">À espera que o professor comece. A pergunta aparece aqui sozinha.</p></div>`;
  const q = Q.find(x=>x.id===estado.qid) || Q[0];
  const minha = meuVoto.ronda===estado.ronda ? meuVoto.r?.[q.id] : undefined;
  const revelar = estado.fase==="resposta";
  return `<section style="display:flex;flex-direction:column;gap:16px">
    ${cabecalho(q,estado.pos||1,estado.total||Q.length)}
    <div class="perg"><h2>${texto(q.p)}</h2>${folha(q)}</div>
    ${opcoes(q,{modo:'votar', escolha: minha===undefined?null:minha, revelar})}
    <p style="margin:0;font-size:14px;color:var(--muted)">Sala ${esc(sala)} · <a href="#" id="sairsala">mudar de sala</a></p>
    ${revelar ? explicacao(q, minha===undefined?null:minha) :
      `<p class="aviso">${minha===undefined ? "Toca numa opção para responder." : "Resposta enviada: <b>"+LETRAS[minha]+"</b>. Podes mudar até o professor revelar."}</p>`}
    ${avisoTxt?`<p class="aviso">${esc(avisoTxt)}</p>`:""}
  </section>`;
}
function ligaResponder(){
  const f = document.getElementById("fsala"); if(f){ f.onsubmit = e=>{ e.preventDefault(); const v = document.getElementById("csala").value.trim(); if(/^\d{4}$/.test(v)) entraSala(v); }; document.getElementById("csala").focus(); return; }
  const sai = document.getElementById("sairsala"); if(sai) sai.onclick = e=>{ e.preventDefault(); sala=null; guarda.set("quiz-sala-aluno",""); if(cliente){ try{cliente.end(true);}catch(x){} cliente=null; } aoVivo=false; render(); };
  document.querySelectorAll("button.op").forEach(btn=>btn.onclick = async ()=>{
    if(enviando) return;
    const op = +btn.dataset.op; const r = meuVoto.ronda===estado.ronda ? {...meuVoto.r} : {};
    r[estado.qid] = op; meuVoto = {ronda:estado.ronda, r}; avisoTxt=""; render(); enviando=true;
    if(cliente && estadoLigacao === "ligado"){ cliente.publish(topico("votos/"+meuId), JSON.stringify(meuVoto), { qos: 1, retain: true }); guarda.set("quiz-voto", JSON.stringify(meuVoto)); }
    else mostraAviso("Sem ligação. A resposta será enviada quando voltares a tocar numa opção.");
    enviando=false;
  });
}

let estudo = null;
function novoEstudo(nivel, tipo="0"){ estudo = {nivel, tipo, L: lista(nivel, tipo).map(q=>q.id), i:0, resp:{}}; }
function vEstudar(){
  if(!estudo) novoEstudo("0");
  if(estudo.i >= estudo.L.length){
    const certas = estudo.L.filter(id=>estudo.resp[id]===Q.find(q=>q.id===id).c).length;
    const temas = {}; estudo.L.forEach(id=>{ const q=Q.find(x=>x.id===id); temas[q.tema]=temas[q.tema]||[0,0]; temas[q.tema][1]++; if(estudo.resp[id]===q.c) temas[q.tema][0]++; });
    return `<section class="final"><span class="chip">Terminaste</span><div class="grande">${certas}/${estudo.L.length}</div>
      <p class="lead">${certas===estudo.L.length?"Acertaste todas!": certas/estudo.L.length>=.7?"Muito bem. Revê os temas com menos pontos.":"Continua a treinar. Revê os temas com menos pontos no resumo de fórmulas."}</p>
      <div class="lista-temas">${Object.entries(temas).map(([t,[a,n]])=>`<div><span>${esc(t)}</span><b style="font-variant-numeric:tabular-nums">${a}/${n}</b></div>`).join("")}</div>
      <button class="btn prim" id="denovo">Começar outra vez</button></section>`;
  }
  const q = Q.find(x=>x.id===estudo.L[estudo.i]); const e = estudo.resp[q.id]; const feito = e!==undefined;
  return `<section style="display:flex;flex-direction:column;gap:16px">
    <div class="grupo"><label class="grupo" style="font-size:15px;color:var(--muted)">Nível
      <select id="enivel"><option value="0">Todos</option><option value="1">Fácil</option><option value="2">Médio</option><option value="3">Difícil</option></select></label>
      <label class="grupo" style="font-size:15px;color:var(--muted)">Tipo <select id="etipo">${optTipos()}</select></label></div>
    ${cabecalho(q,estudo.i+1,estudo.L.length)}
    <div class="slide"><div class="perg"><h2>${texto(q.p)}</h2>${folha(q)}</div>
      <div class="perg">${opcoes(q,{modo:'votar', escolha: feito?e:null, revelar:feito})}${feito?explicacao(q,e):""}
      ${feito?`<div class="grupo"><button class="btn prim" id="eseg">${estudo.i===estudo.L.length-1?"Ver resultado":"Seguinte →"}</button></div>`:""}</div></div>
  </section>`;
}
function ligaEstudar(){
  const d = id=>document.getElementById(id);
  if(d("denovo")) return d("denovo").onclick = ()=>{ novoEstudo(estudo.nivel, estudo.tipo); render(); };
  const s = d("enivel"); s.value = estudo.nivel; s.onchange = ()=>{ novoEstudo(s.value, estudo.tipo); render(); };
  const t = d("etipo"); t.value = estudo.tipo; t.onchange = ()=>{ novoEstudo(estudo.nivel, t.value); render(); };
  document.querySelectorAll("button.op").forEach(b=>b.onclick=()=>{ const id=estudo.L[estudo.i]; if(estudo.resp[id]!==undefined) return; estudo.resp[id]=+b.dataset.op; render(); d("eseg")?.focus(); });
  if(d("eseg")) d("eseg").onclick = ()=>{ estudo.i++; render(); window.scrollTo({top:0}); };
}

function vista(){ const h = location.hash.replace("#",""); return ["apresentar","responder","estudar"].includes(h)?h:"inicio"; }
function render(){
  const v = vista();
  document.querySelectorAll(".nav a").forEach(a=>a.setAttribute("aria-current", a.dataset.v===v?"page":"false"));
  const foco = document.activeElement && document.activeElement.id;
  app.innerHTML = v==="apresentar"? vApresentar() : v==="responder"? vResponder() : v==="estudar"? vEstudar() : vInicio();
  if(v==="apresentar") ligaApresentar(); if(v==="responder") ligaResponder(); if(v==="estudar") ligaEstudar();
  if(foco && document.getElementById(foco)) document.getElementById(foco).focus({preventScroll:true});
}
window.addEventListener("hashchange",()=>{ avisoTxt=""; const v=vista(); if((v==="apresentar"||v==="responder") && (!cliente || (v==="apresentar") !== eraProf)){ eraProf = v==="apresentar"; liga(); } render(); });
let eraProf = vista()==="apresentar";
render(); if(vista()==="apresentar"||vista()==="responder") liga();
</script>
